# ==============================================================================
# TEMPLATE-DEPLOYMENT.yaml (Deployment Contract Template)
# ==============================================================================
# Downstream Teams (Product, Supplier, Inventory, Sales):
# Copy this template to your service directory and update the placeholders
# (marked with <...>) to create your Kubernetes deployment manifest.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: <your-service-name>       # e.g., product, supplier, inventory, sales
  labels:
    app: <your-service-name>
spec:
  replicas: 1                      # Adjust as needed (e.g., 2 for load balancing)
  selector:
    matchLabels:
      app: <your-service-name>
  template:
    metadata:
      labels:
        app: <your-service-name>
    spec:
      containers:
        - name: <your-service-name>
          image: smartstock-<your-service-name>:1.0  # Image name should match Makefile/Docker setup
          imagePullPolicy: Never                     # Required for local Minikube/Kind testing
          ports:
            - containerPort: <your-service-port>     # e.g., 3002, 3003, 4003, 4004
          env:
            # 1. MONGO_URI is injected dynamically from the shared cluster secrets.
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: smartstock-secret
                  key: MONGO_URI

            # 2. JWT_SECRET is injected dynamically from the shared cluster secrets.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartstock-secret
                  key: JWT_SECRET

            # 3. Add any service-specific environment variables here
            # For example, Sales needs the Inventory Service endpoint:
            # - name: INVENTORY_SERVICE_URL
            #   value: "http://inventory:4003"
---
apiVersion: v1
kind: Service
metadata:
  name: <your-service-name>
spec:
  ports:
    - port: <your-service-port>
      targetPort: <your-service-port>
  selector:
    app: <your-service-name>
