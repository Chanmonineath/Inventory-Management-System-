apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales
  template:
    metadata:
      labels:
        app: sales
    spec:
      containers:
        - name: sales
          image: smartstock-sales:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 4004
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017/smartstock_sales"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartstock-secret
                  key: JWT_SECRET
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory:4003"
            - name: SALES_PORT
              value: "4004"
