# CHANGE THESE VALUES BEFORE DEPLOYING TO ANYTHING BEYOND A LOCAL MINIKUBE DEMO.
# stringData lets us write plain text here; Kubernetes base64-encodes it for us.
apiVersion: v1
kind: Secret
metadata:
  name: smartstock-secret
  namespace: smartstock
type: Opaque
stringData:
  JWT_SECRET: "4c705cca1aa6a1c23a7d565cfa83091366739b00acb377920a73b31282c09b94"

  MONGO_INITDB_ROOT_USERNAME: "smartstock_admin"
  MONGO_INITDB_ROOT_PASSWORD: "7d770af62f533d8fc24ed35a"

  # One Mongo instance (mongo-service), one database per microservice,
  # all authenticated through the root user created above.
  MONGO_URI_AUTH: "mongodb://smartstock_admin:7d770af62f533d8fc24ed35a@mongo-service:27017/auth_db?authSource=admin"
  MONGO_URI_PRODUCT: "mongodb://smartstock_admin:7d770af62f533d8fc24ed35a@mongo-service:27017/product_db?authSource=admin"
  MONGO_URI_SUPPLIER: "mongodb://smartstock_admin:7d770af62f533d8fc24ed35a@mongo-service:27017/supplier_db?authSource=admin"
  MONGO_URI_INVENTORY: "mongodb://smartstock_admin:7d770af62f533d8fc24ed35a@mongo-service:27017/inventory_db?authSource=admin"
  MONGO_URI_SALES: "mongodb://smartstock_admin:7d770af62f533d8fc24ed35a@mongo-service:27017/sales_db?authSource=admin"
